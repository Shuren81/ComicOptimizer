# Compila ComicOptimizer per Windows (per gli amici) e AppImage per Linux (per Shuren)
# su macchine di GitHub. Parte da solo quando pubblichi una Release, oppure a mano
# dalla scheda Actions → "Build" → "Run workflow".
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # serve per allegare i file alla Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Icona .ico dal PNG
        run: python -c "from PIL import Image; Image.open('comicoptimizer.png').save('comicoptimizer.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: 7-Zip da includere (legge ZIP, RAR e RAR5)
        shell: pwsh
        run: |
          $src = "C:\Program Files\7-Zip"
          if (-not (Test-Path "$src\7z.exe")) { choco install 7zip -y --no-progress }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item "$src\7z.exe", "$src\7z.dll" bin\
          Copy-Item "$src\License.txt" bin\7-Zip-License.txt

      - name: PyInstaller
        run: >
          pyinstaller main.py
          --noconfirm --clean --windowed
          --name ComicOptimizer
          --icon comicoptimizer.ico
          --add-data "comicoptimizer.png;."
          --add-binary "bin\7z.exe;bin"
          --add-binary "bin\7z.dll;bin"
          --add-data "bin\7-Zip-License.txt;bin"
          --collect-submodules send2trash
          --exclude-module tkinter

      - name: Pacchetto zip
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md dist\ComicOptimizer\
          Copy-Item LEGGIMI-WINDOWS.txt dist\ComicOptimizer\
          $name = "ComicOptimizer-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path dist\ComicOptimizer -DestinationPath $name
          "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Test di avvio (import e 7z incluso)
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ComicOptimizer\ComicOptimizer.exe")) { throw "exe mancante" }
          if (-not (Test-Path "dist\ComicOptimizer\_internal\bin\7z.exe")) { throw "7z.exe mancante" }

      - uses: actions/upload-artifact@v4
        with:
          name: ComicOptimizer-windows
          path: ${{ env.ZIP_NAME }}

      - name: Allega alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}

  linux-appimage:
    runs-on: ubuntu-22.04   # 22.04 ha compatibilità più ampia della "latest" per AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze di sistema (7z, unrar, Qt/X11 per PyInstaller)
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller (onedir)
        run: >
          pyinstaller main.py
          --noconfirm --clean --windowed
          --name ComicOptimizer
          --add-data "comicoptimizer.png:."
          --collect-submodules send2trash
          --exclude-module tkinter

      - name: Prepara AppDir
        run: |
          set -e
          APP=AppDir
          mkdir -p "$APP/usr/bin"
          cp -r dist/ComicOptimizer/. "$APP/usr/bin/"
          cp comicoptimizer.png "$APP/comicoptimizer.png"
          cp comicoptimizer.png "$APP/.DirIcon"
          cat > "$APP/comicoptimizer.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ComicOptimizer
          Comment=Gestione, riparazione e ottimizzazione di librerie di fumetti digitali
          Exec=ComicOptimizer
          Icon=comicoptimizer
          Categories=Graphics;Utility;
          Terminal=false
          EOF
          ln -s usr/bin/ComicOptimizer "$APP/AppRun"

      - name: Scarica appimagetool
        run: |
          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Crea AppImage
        run: |
          set -e
          # --appimage-extract-and-run evita di dover avere FUSE attivo sul runner
          ./appimagetool --appimage-extract-and-run AppDir "ComicOptimizer-${{ github.ref_name }}-x86_64.AppImage"
          chmod +x "ComicOptimizer-${{ github.ref_name }}-x86_64.AppImage"
          echo "APPIMAGE_NAME=ComicOptimizer-${{ github.ref_name }}-x86_64.AppImage" >> $GITHUB_ENV

      - name: Test di avvio (l'AppImage esiste ed è eseguibile)
        run: |
          test -x "${{ env.APPIMAGE_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ComicOptimizer-appimage
          path: ${{ env.APPIMAGE_NAME }}

      - name: Allega alla Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE_NAME }}
